name: Workspace finalization patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workspace-finalize-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final workspace patch
        run: python backend/scripts/workspace_finalize_patch.py
      - name: Validate backend bundle
        working-directory: backend
        run: npm install --progress=false && npx wrangler deploy --dry-run --outdir /tmp/byggplan-worker
      - name: Commit result and cleanup
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          rm .github/workflows/workspace-finalize-patch.yml backend/scripts/workspace_finalize_patch.py
          git add backend/src/workspace-access.ts backend/src/master-project-clone-routes.ts backend/src/auth-entry.ts .github/workflows/workspace-finalize-patch.yml backend/scripts/workspace_finalize_patch.py
          git commit -m "Finalize workspace isolation and project creation"
          git push
